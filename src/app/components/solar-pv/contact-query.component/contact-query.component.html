<section class="contact-query-section">

  <div class="contact-query-header">
    <h2>Have a Question?</h2>
    <p>Leave your number, our team will call you back shortly.</p>
  </div>

  <form class="contact-query-form" (ngSubmit)="submitQuery()" #queryForm="ngForm">

    <div class="form-group">
      <label for="name">Name</label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="fullName"
        required
        placeholder="Enter your name"
      />
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        [(ngModel)]="phoneNumber"
        required
        pattern="[0-9]{10}"
        maxlength="10"
        placeholder="10-digit mobile number"
      />
    </div>

    <button type="submit" [disabled]="!queryForm.valid">
      Submit
    </button>

    <p class="form-success" *ngIf="submitted">Thank you! We'll contact you soon.</p>

  </form>

</section>
